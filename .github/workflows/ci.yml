name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Install, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # TypeScript 7: tsc for packages/flags, svelte-check --tsgo for the apps.
      - name: Type check
        run: pnpm -r check

      - name: Unit tests (flags, kit)
        run: |
          pnpm --filter @tsidp-flags/flags test
          pnpm --filter @tsidp-flags/kit test

      - name: Probe unit tests
        run: python3 -m unittest discover -s probe -p 'test_*.py'

      # dhall and dhall-json release binaries, pinned by sha256, so the ACL
      # render and type check run with no Nix and no import hashes.
      - name: Install dhall and dhall-json
        run: |
          set -euo pipefail
          base=https://github.com/dhall-lang/dhall-haskell/releases/download/1.42.2
          mkdir -p "$RUNNER_TEMP/dhall"
          cd "$RUNNER_TEMP/dhall"
          curl -fsSLO "$base/dhall-1.42.2-x86_64-linux.tar.bz2"
          curl -fsSLO "$base/dhall-json-1.7.12-x86_64-linux.tar.bz2"
          sha256sum -c - <<'SUMS'
          b2509bbe07772f268ef193d9c36b18aa13bd32ecec76fd4b21782715b38386a3  dhall-1.42.2-x86_64-linux.tar.bz2
          acbada5e29ecc9b6a723c3f390beb76b9db26df81546d1f472415a2f387bc457  dhall-json-1.7.12-x86_64-linux.tar.bz2
          SUMS
          tar xjf dhall-1.42.2-x86_64-linux.tar.bz2
          tar xjf dhall-json-1.7.12-x86_64-linux.tar.bz2
          echo "$RUNNER_TEMP/dhall/bin" >> "$GITHUB_PATH"

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: ACL render and structural check
        run: just acl-check

      - name: Compose config (default and tagged-identity profile)
        run: |
          docker compose config -q
          docker compose --profile tagged-identity config -q

      - name: Build both apps
        run: |
          pnpm --filter @tsidp-flags/kit build
          pnpm --filter @tsidp-flags/static build

  e2e:
    name: Playwright (static app)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @tsidp-flags/static exec playwright install --with-deps chromium

      - name: Playwright test
        run: pnpm --filter @tsidp-flags/static test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: apps/static/playwright-report
          retention-days: 7

  secrets:
    name: Secret and denylist scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # gitleaks-action lists the pull request commits through the API.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # DENYLIST is a repository secret (newline-separated tokens). The repo
      # itself holds no real values; with no secret set the check reports that
      # nothing was checked, and REQUIRE_DENYLIST=1 turns that into a failure.
      - name: Denylist check
        run: bash scripts/denylist-check.sh
        env:
          DENYLIST: ${{ secrets.DENYLIST }}
          REQUIRE_DENYLIST: ${{ secrets.DENYLIST != '' && '1' || '0' }}
