# Dependabot version updates. Security alerts and security updates are
# repository settings; see README "Dependency hygiene".
version: 2
updates:
  # One pnpm workspace (pnpm-lock.yaml at the root covers apps/* and packages/*).
  # One grouped weekly PR. The exact-pinned stack below moves only in a
  # deliberate PR, together with patches/ (the patch files are keyed to the
  # exact @sveltejs/kit and svelte-check versions).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns: ["*"]
    ignore:
      - dependency-name: "@sveltejs/kit"
      - dependency-name: "svelte"
      - dependency-name: "vite"
      - dependency-name: "typescript"
      - dependency-name: "@typescript/typescript6"
      - dependency-name: "svelte-check"
      - dependency-name: "vitest"
      - dependency-name: "@playwright/test"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
